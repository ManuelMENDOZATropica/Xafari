<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: el layout se reajusta cuando abre el teclado -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/iconos/Pictograma_Xafari_Positivo.png" />
    <meta name="theme-color" content="#233C15" />
    <link rel="preload" href="/img/fondoHome.webp" as="image" type="image/webp" />
    <title>Xafari</title>
    <style>
      /* #root ocupa exactamente el viewport visible — sin espacio vacío al abrir teclado */
      #root {
        height: 100dvh;
        overflow: hidden;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
